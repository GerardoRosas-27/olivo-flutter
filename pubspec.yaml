name: olivo_flutter
description: "Olivo — invitaciones digitales de boda (QR, RSVP, WhatsApp, escáner). Multipuerto Flutter."
publish_to: 'none'
version: 1.1.0+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  mobile_scanner: ^6.0.2
  permission_handler: ^11.3.1
  share_plus: ^13.3.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
